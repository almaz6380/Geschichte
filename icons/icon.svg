<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- Glaskörper: zwei Kolben, die sich in einer schmalen Taille treffen -->
    <path id="glass" d="M184 146H328C328 206 294 232 266 256C294 280 328 306 328 366H184C184 306 218 280 246 256C218 232 184 206 184 146Z"/>
    <clipPath id="inside"><use href="#glass"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <g transform="translate(256 256) scale(1.08) translate(-256 -256)">
    <!-- Glas, leicht getönt -->
    <use href="#glass" fill="#fff7ed" fill-opacity="0.16"/>

    <!-- Sand bleibt im Glas: Rest oben, Strahl durch die Taille, Haufen unten -->
    <g clip-path="url(#inside)" fill="url(#sand)">
      <rect x="150" y="204" width="212" height="56"/>
      <rect x="252" y="250" width="8" height="70"/>
      <path d="M170 370C200 346 226 312 256 304C286 312 312 346 342 370Z"/>
    </g>

    <use href="#glass" fill="none" stroke="#fff7ed" stroke-width="14" stroke-linejoin="round"/>

    <!-- Gestell: zwei Stäbe und Deckplatten -->
    <g fill="#fff7ed">
      <rect x="158" y="140" width="14" height="232" rx="7"/>
      <rect x="340" y="140" width="14" height="232" rx="7"/>
      <rect x="140" y="112" width="232" height="36" rx="18"/>
      <rect x="140" y="364" width="232" height="36" rx="18"/>
    </g>
  </g>
</svg>
