<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Weltgeschichte</title>
  <meta name="description" data-i18n-content="app.description" content="Weltgeschichte von der Urgeschichte bis zur Gegenwart: Epochen, Querschnittsthemen, Zeitleiste, Glossar, Quiz, Suche und Lesezeichen. Funktioniert offline.">
  <meta name="theme-color" content="#f8f7f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161b" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Geschichte">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/timeline.css">
  <link rel="stylesheet" href="./css/quiz.css">
  <script>
    // Theme so früh wie möglich setzen, um Flackern zu vermeiden.
    try {
      var t = JSON.parse(localStorage.getItem('wg.theme') || '"system"');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#view" data-i18n="app.skipToContent">Zum Inhalt springen</a>
  <header class="app-header">
    <a class="brand" href="#/" data-i18n-aria="app.brandAria" aria-label="Weltgeschichte – Startseite">
      <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-hourglass"/></svg>
      <span data-i18n="app.name">Weltgeschichte</span>
    </a>
    <nav class="top-nav" data-i18n-aria="nav.aria.main" aria-label="Hauptnavigation">
      <a href="#/" data-nav="home" data-i18n="nav.home">Start</a>
      <a href="#/epochen" data-nav="epochen" data-i18n="nav.epochs">Epochen</a>
      <a href="#/zeitleiste" data-nav="zeitleiste" data-i18n="nav.timeline">Zeitleiste</a>
      <a href="#/themen" data-nav="themen" data-i18n="nav.themes">Themen</a>
      <a href="#/glossar" data-nav="glossar" data-i18n="nav.glossary">Glossar</a>
      <a href="#/quiz" data-nav="quiz" data-i18n="nav.quiz">Quiz</a>
      <a href="#/lesezeichen" data-nav="lesezeichen" data-i18n="nav.bookmarks">Lesezeichen</a>
    </nav>
    <div class="header-actions">
      <button id="install-btn" class="btn btn-small" type="button" data-i18n="app.install" hidden>App installieren</button>
      <a class="icon-btn" href="#/suche" data-nav="suche" data-i18n-aria="nav.search" aria-label="Suche">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
      </a>
      <div class="lang-picker">
        <svg class="lang-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-globe"/></svg>
        <select id="lang-select" data-i18n-aria="lang.label" aria-label="Sprache"></select>
      </div>
      <button id="theme-btn" class="icon-btn" type="button" data-i18n-aria="theme.toggle" data-i18n-title="theme.toggle" aria-label="Farbschema wechseln" title="Farbschema wechseln">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-theme"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1" aria-live="polite">
    <div class="loading" data-i18n="app.loading">Inhalte werden geladen …</div>
  </main>

  <nav class="bottom-nav" data-i18n-aria="nav.aria.bottom" aria-label="Navigation">
    <a href="#/" data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-home"/></svg><span data-i18n="nav.home">Start</span></a>
    <a href="#/epochen" data-nav="epochen"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-book"/></svg><span data-i18n="nav.epochs">Epochen</span></a>
    <a href="#/zeitleiste" data-nav="zeitleiste"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-timeline"/></svg><span data-i18n="nav.timeline">Zeitleiste</span></a>
    <a href="#/quiz" data-nav="quiz"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-quiz"/></svg><span data-i18n="nav.quiz">Quiz</span></a>
    <a href="#/mehr" data-nav="mehr"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-more"/></svg><span data-i18n="nav.more">Mehr</span></a>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-hourglass" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 3h12M6 21h12M8 3v3.5a4 4 0 0 0 1.6 3.2L12 12l-2.4 2.3A4 4 0 0 0 8 17.5V21M16 3v3.5a4 4 0 0 1-1.6 3.2L12 12l2.4 2.3a4 4 0 0 1 1.6 3.2V21"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5V5.5M20 18v3H6.5"/></symbol>
      <symbol id="i-timeline" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M3 12h18M7 12v-4M12 12v5M17 12v-3"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/><circle cx="12" cy="18" r="1.5" fill="currentColor"/><circle cx="17" cy="8" r="1.5" fill="currentColor"/></symbol>
      <symbol id="i-quiz" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5v.2"/><circle cx="12" cy="17" r="1" fill="currentColor"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="m15.5 15.5 5 5"/></symbol>
      <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></symbol>
      <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-bookmark-filled" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></symbol>
      <symbol id="i-topic" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h10M4 18h16"/></symbol>
      <symbol id="i-glossary" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M5 4h9l5 5v11H5zM14 4v5h5M8 13h8M8 17h5"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z" fill="currentColor"/></symbol>
    </defs>
  </svg>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
