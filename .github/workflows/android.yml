name: Android App

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Zu Google Play hochladen? (aus = nur bauen, AAB als Artefakt)'
        type: boolean
        default: true
      track:
        description: 'Play-Track'
        type: choice
        default: 'production'
        options: ['production', 'beta', 'alpha', 'internal']
      rollout:
        description: 'An wie viele Nutzer?'
        type: choice
        default: 'complete'
        options: ['complete', '0.5', '0.2']
      notes:
        description: 'Was-ist-neu-Text (de-DE, max. 500 Zeichen)'
        type: string
        default: 'Fünf neue Epochen: Ozeanien und der Pazifik, das Byzantinische Reich, Südostasien, Wikinger und Nordeuropa sowie Russland und Osteuropa. Insgesamt jetzt 25 Epochen mit 644 Ereignissen, 326 Personen, 200 Begriffen und 1.300 Quizfragen.'
      texte:
        description: 'Store-Texte (Kurzbeschreibung, Beschreibung) aus store/store-texte.json setzen'
        type: boolean
        default: true
      version_code:
        description: 'versionCode (leer = Laufnummer). Nur setzen, wenn Play eine höhere Zahl verlangt.'
        type: string
        default: ''
# Gebaut wird nur auf Zuruf. Seit 04.10.2026 nur noch auf GitHubs Rechnern — kein
# Self-hosted Runner in einem oeffentlichen Repo (siehe ci.yml).

jobs:
  build:
    name: Android bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android-SDK finden
        # GitHubs Rechner setzen ANDROID_HOME selbst. Auf dem eigenen Mac liegt
        # das SDK dort, wohin Android Studio es installiert.
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] && [ -d "$HOME/Library/Android/sdk" ]; then
            SDK="$HOME/Library/Android/sdk"
          fi
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "ABBRUCH: Kein Android-SDK gefunden (Android Studio einmal starten)."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Web-App einspielen
        run: npm run cap:sync -- android
      - name: Gradle-Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test-Build (unsigniert)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Signierschlüssel bereitstellen
        id: keystore
        if: ${{ env.KEYSTORE != '' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"

      - name: Signiertes App-Bundle für Google Play (AAB)
        if: ${{ steps.keystore.outputs.path != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ inputs.version_code || github.run_number }}
        run: |
          ./gradlew bundleRelease --no-daemon
          ls -la app/build/outputs/bundle/release/

      - name: AAB als Download bereitstellen
        if: ${{ steps.keystore.outputs.path != '' }}
        # Das Artefakt ist der einzige Weg an die Datei.
        uses: actions/upload-artifact@v4
        with:
          name: weltgeschichte-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Upload wie in mahjong-app: Dienstkonto aus dem Secret PLAY_SERVICE_ACCOUNT_JSON,
      # scripts/play-upload.py (edits -> bundles -> tracks -> validate/commit).
      - name: Zu Google Play hochladen
        if: ${{ steps.keystore.outputs.path != '' && inputs.upload }}
        env:
          PLAY_KEY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_PACKAGE: de.almaz.weltgeschichte
          TRACK: ${{ inputs.track }}
          ROLLOUT: ${{ inputs.rollout }}
          NOTES: ${{ inputs.notes }}
          TEXTE: ${{ inputs.texte }}
        run: |
          if [ -z "$PLAY_KEY_JSON" ]; then
            echo "::warning::Secret PLAY_SERVICE_ACCOUNT_JSON fehlt in diesem Repo – nichts hochgeladen, das AAB liegt als Artefakt bereit."
            echo "## Google-Play-Upload übersprungen" >> "$GITHUB_STEP_SUMMARY"
            echo "Secret PLAY_SERVICE_ACCOUNT_JSON fehlt (Settings → Secrets and variables → Actions). Derselbe Dienstkonto-JSON wie bei mahjong-app; das Dienstkonto braucht in der Play Console Zugriff auf die App." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          printf '%s' "$PLAY_KEY_JSON" > "$RUNNER_TEMP/play-key.json"
          export PLAY_KEY="$RUNNER_TEMP/play-key.json"
          PY="$RUNNER_TEMP/venv/bin/python"
          echo "--- Stand vorher ($TRACK) ---"
          "$PY" scripts/play-upload.py --status --track "$TRACK" || true
          if [ "$ROLLOUT" = "complete" ]; then ARG="--complete"; else ARG="--fraction $ROLLOUT"; fi
          "$PY" scripts/play-upload.py --aab android/app/build/outputs/bundle/release/app-release.aab \
            --track "$TRACK" $ARG --notes "${NOTES:0:500}" --notes-file "store/whatsnew-$(node -p "require('./package.json').version").json"
          echo "## Google Play: hochgeladen ($TRACK, $ROLLOUT)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TEXTE" = "true" ]; then
            "$PY" scripts/play-upload.py --texte store/store-texte.json
            echo "Store-Texte aus store/store-texte.json gesetzt." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Hinweis
        if: ${{ steps.keystore.outputs.path == '' }}
        run: |
          echo "## Android-Build erfolgreich (nur Test-Build)" >> "$GITHUB_STEP_SUMMARY"
          echo "Für das Google-Play-Bundle fehlen noch die Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Den Schlüssel lokal mit keytool erzeugen und die Werte eintragen (siehe docs/APP-STORES.md)." >> "$GITHUB_STEP_SUMMARY"

      - name: Signierschluessel entfernen
        if: always()
        run: rm -rf "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play-key.json" "$RUNNER_TEMP/venv"
