name: Android Signierschlüssel erzeugen

# Einmalig ausführen. Erzeugt den Upload-Schlüssel für Google Play und zeigt die Werte,
# die als GitHub-Secrets eingetragen werden müssen. Den Schlüssel danach sicher aufbewahren!

on:
  workflow_dispatch:

jobs:
  keystore:
    name: Schlüssel erzeugen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Keystore erzeugen
        run: |
          PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)
          keytool -genkeypair -v -keystore upload.jks -alias weltgeschichte -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Weltgeschichte, OU=App, O=almaz, L=Berlin, C=DE"
          B64=$(base64 -w0 upload.jks)
          {
            echo "## Diese vier Werte als Secrets eintragen"
            echo ""
            echo "Repository → Settings → Secrets and variables → Actions → New repository secret"
            echo ""
            echo "| Name | Wert |"
            echo "|---|---|"
            echo "| ANDROID_KEY_ALIAS | \`weltgeschichte\` |"
            echo "| ANDROID_KEYSTORE_PASSWORD | \`$PASS\` |"
            echo "| ANDROID_KEY_PASSWORD | \`$PASS\` |"
            echo "| ANDROID_KEYSTORE_BASE64 | siehe Block unten (komplett kopieren) |"
            echo ""
            echo "ANDROID_KEYSTORE_BASE64:"
            echo ""
            echo '```'
            echo "$B64"
            echo '```'
            echo ""
            echo "**Wichtig:** Diese Seite und die Datei aus den Artefakten sicher aufbewahren (Passwort-Manager). Ohne diesen Schlüssel sind später keine Updates der Android-App möglich. Diesen Workflow nur einmal ausführen."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$PASS" > keystore-passwort.txt
      - name: Schlüssel als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: android-upload-keystore
          path: |
            upload.jks
            keystore-passwort.txt
          retention-days: 90
