name: Android Signierschlüssel erzeugen

# Einmalig ausführen. Erzeugt den Upload-Schlüssel für Google Play und zeigt die Werte,
# die als GitHub-Secrets eingetragen werden müssen. Den Schlüssel danach sicher aufbewahren!

# Nur bei privatem Repository ausführen: Die Werte stehen in der Zusammenfassung des Laufs.
# Danach den Lauf löschen (… → Delete workflow run).

on:
  workflow_dispatch:
    inputs:
      laeufer:
        description: 'Wo laufen? mac = eigener Mac (kostenlos, Schlüssel-Sicherung im Benutzerordner), github = GitHub-Rechner (kostet Minuten)'
        type: choice
        default: 'mac'
        options: ['mac', 'github']

jobs:
  keystore:
    name: Schlüssel erzeugen
    runs-on: ${{ inputs.laeufer == 'mac' && fromJSON('["self-hosted", "macOS"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Vorhandenen Schlüssel prüfen
        # Ein zweiter Schlüssel würde den ersten unbrauchbar machen – dann lieber gar nichts erzeugen.
        if: ${{ inputs.laeufer == 'mac' }}
        run: |
          if [ -e "$HOME/Weltgeschichte-Android-Schluessel/upload.jks" ]; then
            echo "ABBRUCH: Auf dem Mac liegt schon ein Schlüssel (~/Weltgeschichte-Android-Schluessel). Nicht neu erzeugen!"
            exit 1
          fi
      - name: Keystore erzeugen
        run: |
          PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)
          keytool -genkeypair -v -keystore upload.jks -alias weltgeschichte -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Weltgeschichte, OU=App, O=almaz, L=Berlin, C=DE"
          # base64 ohne Zeilenumbrüche, auf Linux und macOS gleich
          B64=$(base64 < upload.jks | tr -d '\n')
          {
            echo "## Diese vier Werte als Secrets eintragen"
            echo ""
            echo "Repository → Settings → Secrets and variables → Actions → New repository secret"
            echo ""
            echo "| Name | Wert |"
            echo "|---|---|"
            echo "| ANDROID_KEY_ALIAS | \`weltgeschichte\` |"
            echo "| ANDROID_KEYSTORE_PASSWORD | \`$PASS\` |"
            echo "| ANDROID_KEY_PASSWORD | \`$PASS\` |"
            echo "| ANDROID_KEYSTORE_BASE64 | siehe Block unten (komplett kopieren) |"
            echo ""
            echo "ANDROID_KEYSTORE_BASE64:"
            echo ""
            echo '```'
            echo "$B64"
            echo '```'
            echo ""
            echo "**Wichtig:** Die Werte im Passwort-Manager sichern. Ohne diesen Schlüssel sind später keine Updates der Android-App möglich. Diesen Workflow nur einmal ausführen und den Lauf nach dem Eintragen löschen."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$PASS" > keystore-passwort.txt
      - name: Schlüssel auf dem Mac sichern
        # Auf dem eigenen Mac bleibt die Sicherung lokal, statt als Artefakt bei GitHub zu liegen.
        if: ${{ inputs.laeufer == 'mac' }}
        run: |
          # Nicht in ~/Documents: macOS sperrt diesen Ordner für Hintergrunddienste wie den Runner.
          ZIEL="$HOME/Weltgeschichte-Android-Schluessel"
          mkdir -p "$ZIEL" && chmod 700 "$ZIEL"
          cp upload.jks keystore-passwort.txt "$ZIEL/" && chmod 600 "$ZIEL"/*
          rm -f upload.jks keystore-passwort.txt
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Sicherung auf dem Mac: \`$ZIEL\` (upload.jks und Passwort)." >> "$GITHUB_STEP_SUMMARY"
      - name: Schlüssel als Artefakt sichern
        if: ${{ inputs.laeufer != 'mac' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-upload-keystore
          path: |
            upload.jks
            keystore-passwort.txt
          retention-days: 90
