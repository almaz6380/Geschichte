name: CI

# --- Warum das hier so steht (28.09.2026) -----------------------------------
#
# Kurze Geschichte, damit niemand sie noch einmal durchlebt:
#
# Am 25.09. wurde das Repository privat gestellt. Private Repositories
# verbrauchen im kostenlosen Plan Actions-Minuten — macOS-Laeufe sogar
# zehnfach. ios.yml, android.yml und android-keystore.yml bekamen damals den
# `laeufer`-Schalter und verloren ihren automatischen Ausloeser. Diese Datei
# wurde uebersehen und lief weiter bei jedem Push auf GitHubs Rechnern. Als die
# Minuten aufgebraucht waren, bekam sie keinen Laeufer mehr zugeteilt: 65 rote
# Laeufe am Stueck, drei Sekunden, ohne Logs. Der Code war nie das Problem.
#
# Seit dem 28.09. ist das Repository wieder OEFFENTLICH, und damit sind
# GitHub-Rechner unbegrenzt kostenlos. Deshalb laeuft CI wieder dort — ohne
# Kontingent, ohne Wartezeit und ohne davon abzuhaengen, ob ein Mac gerade an
# ist.
#
# ⚠ Seit 04.10.2026 gibt es KEINEN `laeufer: mac` mehr, in keinem Workflow: Ein
# oeffentliches Repo mit Self-hosted Runner laesst ueber Fork-PRs fremden Code auf
# dem eigenen Mac laufen. Gegenprobe jederzeit lokal, unabhaengig von GitHub:
# `npm run validate && npm test`.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Daten validieren und testen
    # IMMER GitHubs Rechner (Rechtspruefung 04.10.2026): Dieses Repo ist oeffentlich
    # und reagiert auf pull_request — ein Self-hosted Runner wuerde fremden Code aus
    # Fork-PRs auf Josefs Mac ausfuehren.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Daten validieren
        run: npm run validate
      - name: Tests
        run: npm test
