name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Daten validieren und testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Daten validieren
        run: npm run validate
      - name: Tests
        run: npm test
