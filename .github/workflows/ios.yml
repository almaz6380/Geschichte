name: iOS App

on:
  workflow_dispatch:
    inputs:
      revoke_certificate_id:
        description: "Optional: ID eines Distribution-Zertifikats, das vor dem Lauf widerrufen werden soll"
        required: false
        default: ""
  push:
    branches: ["main"]
    paths: ["ios/**", "js/**", "css/**", "data/**", "index.html", "capacitor.config.json", ".github/workflows/ios.yml"]

jobs:
  build:
    name: iOS bauen
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Xcode auswählen
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Web-App einspielen
        run: npm run cap:sync -- ios

      - name: App-Store-Connect-Schlüssel bereitstellen und prüfen
        id: asc
        if: ${{ env.KEY != '' }}
        env:
          KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          REVOKE_CERT_ID: ${{ github.event.inputs.revoke_certificate_id }}
        run: |
          KEY_ID=$(printf '%s' "$KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf '%s' "$ISSUER_ID" | tr -d '[:space:]')
          TEAM_ID=$(printf '%s' "$TEAM_ID" | tr -d '[:space:]')
          mkdir -p "$HOME/private_keys"
          P8="$HOME/private_keys/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY" | tr -d '\r' > "$P8"
          python3 scripts/check-asc-key.py "$P8" "$KEY_ID" "$ISSUER_ID" de.almaz.weltgeschichte | tee "$RUNNER_TEMP/asc-check.txt"
          if grep -q '^FEHLER' "$RUNNER_TEMP/asc-check.txt"; then
            { echo "## Apple-Schlüssel ungültig"; echo; cat "$RUNNER_TEMP/asc-check.txt"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          { echo "## Apple-Schlüssel geprüft"; echo; cat "$RUNNER_TEMP/asc-check.txt"; } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$TEAM_ID" ] && [ ${#TEAM_ID} -ne 10 ]; then
            echo "Hinweis: APPLE_TEAM_ID hat nicht die üblichen 10 Zeichen. Der Build nutzt ohnehin die Team-ID aus dem Apple-Konto."
          fi
          CACHE_PASS=$(shasum -a 256 "$P8" | cut -c1-64)
          echo "::add-mask::$CACHE_PASS"
          echo "cache_pass=$CACHE_PASS" >> "$GITHUB_OUTPUT"
          echo "path=$P8" >> "$GITHUB_OUTPUT"
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"
          echo "issuer_id=$ISSUER_ID" >> "$GITHUB_OUTPUT"
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"

      - name: Zertifikat und Profil bereitstellen
        id: sign
        if: ${{ steps.asc.outputs.path != '' }}
        working-directory: ios/App
        env:
          TEAM_ID: ${{ steps.asc.outputs.team_id }}
          KEY_ID: ${{ steps.asc.outputs.key_id }}
          ISSUER_ID: ${{ steps.asc.outputs.issuer_id }}
          KEY_PATH: ${{ steps.asc.outputs.path }}
          CERT_PASS: ${{ steps.asc.outputs.cache_pass }}
          CERTS_DIR: ${{ runner.temp }}/certs
          OUT_DIR: ${{ runner.temp }}/out
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_OPT_OUT_USAGE: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: |
          # Das Signierzertifikat liegt verschlüsselt im Repository (fastlane/certs.tar.enc) und wird wiederverwendet.
          mkdir -p "$CERTS_DIR" "$OUT_DIR"
          fingerprint() { (cd "$CERTS_DIR" && find . -type f | sort | xargs -I{} shasum -a 256 {} | shasum -a 256 | cut -c1-16); }
          if [ -f fastlane/certs.tar.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:CERT_PASS -in fastlane/certs.tar.enc | tar -x -C "$CERTS_DIR" \
              && echo "Gespeichertes Zertifikat übernommen." \
              || echo "Gespeichertes Zertifikat nicht lesbar, es wird ein neues erzeugt."
          fi
          BEFORE=$(fingerprint)
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "keychain_password=$KEYCHAIN_PASSWORD" >> "$GITHUB_OUTPUT"
          export KEYCHAIN_PASSWORD
          set +e
          fastlane ios prepare
          RC=$?
          set -e
          AFTER=$(fingerprint)
          if [ -n "$(ls -A "$CERTS_DIR")" ] && [ "$BEFORE" != "$AFTER" ]; then
            tar -c -C "$CERTS_DIR" . | openssl enc -aes-256-cbc -pbkdf2 -pass env:CERT_PASS -out fastlane/certs.tar.enc
            echo "cert_changed=true" >> "$GITHUB_OUTPUT"
          fi
          exit $RC

      - name: Signierzertifikat verschlüsselt im Repository sichern
        if: ${{ always() && steps.sign.outputs.cert_changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/App/fastlane/certs.tar.enc
          git commit -m "iOS: Signierzertifikat (verschlüsselt) gesichert [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "## Signierzertifikat im Repository gesichert" >> "$GITHUB_STEP_SUMMARY"
          echo "Datei ios/App/fastlane/certs.tar.enc (verschlüsselt) wurde auf ${{ github.ref_name }} committet." >> "$GITHUB_STEP_SUMMARY"

      - name: Signierzertifikat zusätzlich als Artefakt sichern
        if: ${{ always() && steps.sign.outputs.cert_changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-signierzertifikat-verschluesselt
          path: ios/App/fastlane/certs.tar.enc
          retention-days: 90

      - name: Archiv bauen und in App Store Connect hochladen
        if: ${{ steps.asc.outputs.path != '' }}
        working-directory: ios/App
        env:
          TEAM_ID: ${{ steps.asc.outputs.team_id }}
          KEY_ID: ${{ steps.asc.outputs.key_id }}
          ISSUER_ID: ${{ steps.asc.outputs.issuer_id }}
          KEY_PATH: ${{ steps.asc.outputs.path }}
          BUILD_NUMBER: ${{ github.run_number }}
          OUT_DIR: ${{ runner.temp }}/out
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_OPT_OUT_USAGE: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: fastlane ios upload

      - name: Test-Build im Simulator (unsigniert, nur ohne Apple-Schlüssel)
        if: ${{ steps.asc.outputs.path == '' }}
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Hinweis
        if: ${{ steps.asc.outputs.path == '' }}
        run: |
          echo "## iOS-Build erfolgreich (nur Test-Build im Simulator)" >> "$GITHUB_STEP_SUMMARY"
          echo "Für den Upload in den App Store fehlen noch die Secrets APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_PRIVATE_KEY und APPLE_TEAM_ID (siehe docs/APP-STORES.md)." >> "$GITHUB_STEP_SUMMARY"
