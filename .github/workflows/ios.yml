name: iOS App

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["ios/**", "js/**", "css/**", "data/**", "index.html", "capacitor.config.json", ".github/workflows/ios.yml"]

jobs:
  build:
    name: iOS bauen
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Xcode auswählen
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Web-App einspielen
        run: npm run cap:sync -- ios

      - name: App-Store-Connect-Schlüssel bereitstellen und prüfen
        id: asc
        if: ${{ env.KEY != '' }}
        env:
          KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY_ID=$(printf '%s' "$KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf '%s' "$ISSUER_ID" | tr -d '[:space:]')
          TEAM_ID=$(printf '%s' "$TEAM_ID" | tr -d '[:space:]')
          mkdir -p "$HOME/private_keys"
          P8="$HOME/private_keys/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY" | tr -d '\r' > "$P8"
          python3 scripts/check-asc-key.py "$P8" "$KEY_ID" "$ISSUER_ID" de.almaz.weltgeschichte | tee "$RUNNER_TEMP/asc-check.txt"
          if grep -q '^FEHLER' "$RUNNER_TEMP/asc-check.txt"; then
            { echo "## Apple-Schlüssel ungültig"; echo; cat "$RUNNER_TEMP/asc-check.txt"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          { echo "## Apple-Schlüssel geprüft"; echo; cat "$RUNNER_TEMP/asc-check.txt"; } >> "$GITHUB_STEP_SUMMARY"
          [ ${#TEAM_ID} -eq 10 ] || { echo "FEHLER: APPLE_TEAM_ID muss genau 10 Zeichen haben (Team ID aus developer.apple.com → Membership)."; exit 1; }
          echo "path=$P8" >> "$GITHUB_OUTPUT"
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"
          echo "issuer_id=$ISSUER_ID" >> "$GITHUB_OUTPUT"
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"

      - name: Test-Build im Simulator (unsigniert)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Archiv erstellen (automatische Cloud-Signierung)
        if: ${{ steps.asc.outputs.path != '' }}
        working-directory: ios/App
        env:
          TEAM_ID: ${{ steps.asc.outputs.team_id }}
          KEY_ID: ${{ steps.asc.outputs.key_id }}
          ISSUER_ID: ${{ steps.asc.outputs.issuer_id }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "${{ steps.asc.outputs.path }}" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: In App Store Connect hochladen
        if: ${{ steps.asc.outputs.path != '' }}
        working-directory: ios/App
        env:
          TEAM_ID: ${{ steps.asc.outputs.team_id }}
          KEY_ID: ${{ steps.asc.outputs.key_id }}
          ISSUER_ID: ${{ steps.asc.outputs.issuer_id }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc.outputs.path }}" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "## Upload nach App Store Connect abgeschlossen" >> "$GITHUB_STEP_SUMMARY"
          echo "Build $GITHUB_RUN_NUMBER erscheint in 10–30 Minuten unter TestFlight bzw. bei der Build-Auswahl der Version." >> "$GITHUB_STEP_SUMMARY"

      - name: Hinweis
        if: ${{ steps.asc.outputs.path == '' }}
        run: |
          echo "## iOS-Build erfolgreich (nur Test-Build im Simulator)" >> "$GITHUB_STEP_SUMMARY"
          echo "Für den Upload in den App Store fehlen noch die Secrets APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_PRIVATE_KEY und APPLE_TEAM_ID (siehe docs/APP-STORES.md)." >> "$GITHUB_STEP_SUMMARY"
